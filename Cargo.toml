[package]
name = "txt-reader-rs"
version = "1.2.0"
edition = "2021"
description = "本地 TXT 阅读器（Rust/egui 版）：老板键、窗口记忆、自动恢复进度、极小窗口"
license = "MIT"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
directories = "5"
global-hotkey = "0.6"
regex = "1"
rfd = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
